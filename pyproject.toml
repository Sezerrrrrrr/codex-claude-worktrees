[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-claude-worktrees"
version = "0.1.0"
description = "Persistent Git worktree lanes shared by Codex and Claude Code, with native configuration parity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sezer Kemer" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
agent-worktrees = "agent_worktrees.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_worktrees = ["templates/**/*", "schemas/*.json"]
